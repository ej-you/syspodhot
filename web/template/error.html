<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка {{ .code }}: Системный Подход</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23120f26'/><circle cx='16' cy='16' r='9' fill='%23f0603f'/></svg>">

  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/index.css">
  <link rel="stylesheet" href="/static/css/error.css">
</head>

<body>
  <main class="error" id="main">
    <div class="error__mark" aria-hidden="true"></div>
    <p class="error__code">{{ .code }}</p>
    <h1 class="error__message">{{ .message }}</h1>
    <a class="btn btn--primary" href="/">Вернуться на главную</a>
  </main>
</body>

</html>
