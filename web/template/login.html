<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход для администратора</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23120f26'/><circle cx='16' cy='16' r='9' fill='%23f0603f'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/index.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
  <main class="login" id="main">
    <div class="login__card">
      <h1 class="login__title">Админ панель</h1>

      {{ if .error }}
      <p class="login__error" role="alert">{{ .error }}</p>
      {{ end }}

      <form class="login__form" action="/admin" method="post">
        <div class="field">
          <label class="field__label" for="username">Логин</label>
          <input class="field__input" id="username" name="username" type="text" autocomplete="username"
            autocapitalize="none" spellcheck="false" required autofocus>
        </div>

        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <input class="field__input" id="password" name="password" type="password" autocomplete="current-password"
            required>
        </div>

        <button class="btn btn--primary login__submit" type="submit">Войти</button>
      </form>
    </div>
  </main>
</body>

</html>
