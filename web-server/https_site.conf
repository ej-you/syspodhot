server {
    # внешний входящий порт
    listen 443 ssl;
    http2 on;
    # имя этого сервера
    server_name syspodhot.ru www.syspodhot.ru;

    ssl_certificate     /etc/letsencrypt/live/syspodhot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syspodhot.ru/privkey.pem;

    # Limit 30 connection count from one ip
    limit_conn conn_limit_per_ip 30;
    # Limit 15 requests per second from one ip
    limit_req zone=req_limit_per_ip burst=15 nodelay;

    # timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # запрос статики
	location /static {
        expires 30d;
		root /app/frontend/;
		try_files $uri $uri/ =404;
    }

    # перенаправление на Go
    location / {
        proxy_pass http://server:8000;
    }

    # ренденринг сбилдинного фронтенда
    location / {
		root /app/frontend/dist/;
		index index.html;
		try_files $uri $uri/ /index.html;
    }
}
