<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Минималистичные инструменты для плиток участников.
       Основной цвет берётся из currentColor, тёмные детали фиксированы. -->

  <symbol id="vocals" viewBox="0 0 120 120">
    <rect x="42" y="10" width="36" height="58" rx="18" fill="currentColor"/>
    <path d="M42 34h36M42 42h36M42 50h36" stroke="#120f26" stroke-width="3" opacity=".55" fill="none"/>
    <path d="M30 58c0 20 13 32 30 32s30-12 30-32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M60 90v16M44 108h32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  </symbol>

  <symbol id="guitar" viewBox="0 0 120 120">
    <g transform="rotate(30 60 60)">
      <rect x="53" y="6" width="14" height="14" rx="3" fill="currentColor"/>
      <rect x="57" y="18" width="6" height="46" fill="currentColor"/>
      <circle cx="60" cy="86" r="22" fill="currentColor"/>
      <circle cx="60" cy="62" r="15" fill="currentColor"/>
      <rect x="49" y="66" width="22" height="5" rx="2" fill="#120f26" opacity=".55"/>
      <rect x="49" y="80" width="22" height="5" rx="2" fill="#120f26" opacity=".55"/>
      <rect x="52" y="94" width="16" height="4" rx="2" fill="#120f26" opacity=".55"/>
    </g>
  </symbol>

  <symbol id="bass" viewBox="0 0 120 120">
    <g transform="rotate(-30 60 60)">
      <rect x="52" y="2" width="16" height="18" rx="3" fill="currentColor"/>
      <path d="M57 8h.1M57 14h.1M63 8h.1M63 14h.1" stroke="#120f26" stroke-width="3" stroke-linecap="round" opacity=".55" fill="none"/>
      <rect x="57" y="18" width="6" height="54" fill="currentColor"/>
      <circle cx="60" cy="92" r="18" fill="currentColor"/>
      <circle cx="60" cy="72" r="12" fill="currentColor"/>
      <rect x="50" y="76" width="20" height="5" rx="2" fill="#120f26" opacity=".55"/>
      <rect x="50" y="86" width="20" height="5" rx="2" fill="#120f26" opacity=".55"/>
      <rect x="53" y="98" width="14" height="4" rx="2" fill="#120f26" opacity=".55"/>
    </g>
  </symbol>

  <symbol id="drums" viewBox="0 0 120 120">
    <path d="M26 66v26c0 8 15 14 34 14s34-6 34-14V66z" fill="currentColor"/>
    <ellipse cx="60" cy="66" rx="34" ry="12" fill="currentColor"/>
    <ellipse cx="60" cy="66" rx="28" ry="8" fill="#120f26" opacity=".45"/>
    <path d="M42 80v22M60 82v24M78 80v22" stroke="#120f26" stroke-width="3" stroke-linecap="round" opacity=".5" fill="none"/>
    <path d="M28 12l34 42M92 12L58 54" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
  </symbol>

  <symbol id="keys" viewBox="0 0 120 120">
    <rect x="10" y="20" width="100" height="12" rx="4" fill="currentColor" opacity=".55"/>
    <rect x="10" y="36" width="100" height="62" rx="6" fill="currentColor"/>
    <path d="M30 36v62M50 36v62M70 36v62M90 36v62" stroke="#120f26" stroke-width="3" opacity=".55" fill="none"/>
    <rect x="24" y="36" width="12" height="36" rx="2" fill="#120f26" opacity=".85"/>
    <rect x="44" y="36" width="12" height="36" rx="2" fill="#120f26" opacity=".85"/>
    <rect x="84" y="36" width="12" height="36" rx="2" fill="#120f26" opacity=".85"/>
  </symbol>

  <!-- Запасной вариант для любой другой роли -->
  <symbol id="other" viewBox="0 0 120 120">
    <ellipse cx="44" cy="88" rx="18" ry="13" transform="rotate(-20 44 88)" fill="currentColor"/>
    <rect x="57" y="20" width="7" height="68" rx="3" fill="currentColor"/>
    <path d="M64 20c2 20 22 20 26 42c-9-9-18-9-26-14z" fill="currentColor"/>
  </symbol>
</svg>
