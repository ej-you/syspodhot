server {
    # внешний входящий порт
    listen 443 ssl;
    http2 on;
    # имя этого сервера
    server_name syspodhot.ru www.syspodhot.ru;

    ssl_certificate     /etc/nginx/ssl/live/syspodhot.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/syspodhot.ru/privkey.pem;

    # запрос статики
	location /static {
        expires 30d;
		root /app/frontend/;
		try_files $uri $uri/ =404;
    }

    # перенаправление на Go
    location / {
        proxy_pass http://server:8000;
    }
}
